---
# Detects the target OS and hands off to the matching task list.
# RHEL/RHEL-derived hosts get Apache; Windows hosts get IIS.

- name: Deploy website on Linux (RHEL/Apache)
  ansible.builtin.include_tasks: linux.yml
  when: ansible_facts['os_family'] == "RedHat"
  tags:
    - always

- name: Deploy website on Windows (IIS)
  ansible.builtin.include_tasks: windows.yml
  when: ansible_facts['os_family'] == "Windows"
  tags:
    - always

- name: Fail on unsupported OS
  ansible.builtin.fail:
    msg: >-
      Unsupported OS family '{{ ansible_facts['os_family'] }}' on
      {{ inventory_hostname }}. This role supports RedHat and Windows only.
  when: ansible_facts['os_family'] not in ["RedHat", "Windows"]
  tags:
    - always
