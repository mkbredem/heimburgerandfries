---
# deploy_linux.yml
#
# Provisions Apache (httpd) on RHEL and deploys the heimburgerandfries
# static website content.
#
# Usage:
#   Initial provision + deploy (installs Apache, opens firewall, deploys site):
#     ansible-playbook -i inventory playbooks/deploy_linux.yml
#
#   Subsequent redeploys (content changes only, Apache already installed):
#     ansible-playbook -i inventory playbooks/deploy_linux.yml --skip-tags apache
#
#   Redeploy content only (equivalent, using the deploy tag instead):
#     ansible-playbook -i inventory playbooks/deploy_linux.yml --tags deploy

- name: Deploy heimburgerandfries website to RHEL
  hosts: "{{ target_hosts | default('webservers') }}"
  become: true

  vars:
    apache_package: httpd
    apache_service: httpd
    site_source_dir: "{{ playbook_dir }}/../linux/"
    site_doc_root: /var/www/html/heimburgerandfries
    site_owner: apache
    site_group: apache

  tasks:
    - name: Assert target host is RHEL or RHEL-derived
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: "This playbook targets RHEL/RHEL-derived hosts only."
      tags:
        - always

    # ------------------------------------------------------------------
    # Apache installation - only needs to run once. On redeploy runs,
    # skip this whole block with --skip-tags apache (dnf/firewalld/service
    # tasks are idempotent regardless, but skipping avoids the extra
    # package-manager and firewall checks on every redeploy).
    # ------------------------------------------------------------------
    - name: Install and start Apache
      tags:
        - apache
        - install
      block:
        - name: Install Apache (httpd)
          ansible.builtin.dnf:
            name: "{{ apache_package }}"
            state: present

        - name: Ensure firewalld is running
          ansible.builtin.systemd:
            name: firewalld
            state: started
            enabled: true

        - name: Open firewall for HTTP and HTTPS
          ansible.posix.firewalld:
            service: "{{ item }}"
            permanent: true
            immediate: true
            state: enabled
          loop:
            - http
            - https

        - name: Enable and start Apache service
          ansible.builtin.systemd:
            name: "{{ apache_service }}"
            state: started
            enabled: true

    # ------------------------------------------------------------------
    # Site deployment - runs every time, including redeploys where the
    # apache tag/block above is skipped.
    # ------------------------------------------------------------------
    - name: Deploy website content
      tags:
        - deploy
      block:
        - name: Ensure document root exists
          ansible.builtin.file:
            path: "{{ site_doc_root }}"
            state: directory
            owner: "{{ site_owner }}"
            group: "{{ site_group }}"
            mode: "0755"

        - name: Sync website content to document root
          ansible.posix.synchronize:
            src: "{{ site_source_dir }}"
            dest: "{{ site_doc_root }}/"
            delete: true
            recursive: true

        - name: Set ownership and permissions on deployed content
          ansible.builtin.file:
            path: "{{ site_doc_root }}"
            state: directory
            recurse: true
            owner: "{{ site_owner }}"
            group: "{{ site_group }}"

        - name: Restore SELinux context on document root
          ansible.builtin.command: restorecon -Rv {{ site_doc_root }}
          changed_when: "'Relabeled' in restorecon_result.stdout"
          register: restorecon_result

        - name: Reload Apache to pick up content changes
          ansible.builtin.systemd:
            name: "{{ apache_service }}"
            state: reloaded
